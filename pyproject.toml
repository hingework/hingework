[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hingework"
version = "0.1.0"
description = "Explicit provider execution with bounded deterministic evidence routing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "PyYAML>=6,<7"]

[tool.setuptools]
packages = ["hingework", "hingework.adapters", "hingework.evidence", "hingework.debate", "hingework.orchestration"]
package-dir = {hingework = "src"}
include-package-data = false

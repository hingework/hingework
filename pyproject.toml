[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-hub"
version = "0.1.0"
description = "Explicit provider execution with bounded deterministic evidence routing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "PyYAML>=6,<7"]

[tool.setuptools]
packages = ["shared_ai_execution", "shared_ai_execution.adapters", "shared_ai_execution.evidence", "shared_ai_execution.debate", "shared_ai_execution.orchestration"]
package-dir = {shared_ai_execution = "src"}
include-package-data = false
